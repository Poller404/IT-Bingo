<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IT-Bingo</title>
<meta name="description" content="Gemeinsames Bingo für Meetings: Begriffe eintragen, abhaken, wenn sie fallen.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23156f63'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap">
<style>
/* Layout: one calm column — title, board settings, 5×5 grid, quiet secondary actions. */
:root {
  --bg: #f6f7f6;
  --surface: #ffffff;
  --ink: #18201e;
  --muted: #66706d;
  --line: #e1e5e3;
  --accent: #156f63;
  --accent-ink: #ffffff;
  --accent-soft: #e3f1ee;
  --danger: #b4372c;
  --font: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111514; --surface: #181d1c; --ink: #e8eceb; --muted: #97a19e; --line: #2a3230;
    --accent: #4fc2b0; --accent-ink: #0b1513; --accent-soft: #1b3330; --danger: #ef7a6f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111514; --surface: #181d1c; --ink: #e8eceb; --muted: #97a19e; --line: #2a3230;
  --accent: #4fc2b0; --accent-ink: #0b1513; --accent-soft: #1b3330; --danger: #ef7a6f;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body {
  margin: 0;
  font-family: var(--font); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 56px;
}
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

header { display: flex; flex-direction: column; gap: 6px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
.claim { margin: 0; color: var(--muted); max-width: 60ch; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.live.on .dot { background: var(--accent); }

.who { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 160px; }
.field label { font-size: 12px; font-weight: 500; color: var(--muted); }
.field input {
  font: 400 14px/1.2 var(--font); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%;
}
.field input:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }

.board { display: flex; flex-direction: column; gap: 12px; }
.status { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.status b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.cell {
  position: relative; aspect-ratio: 1; max-width: 100%;
  border-radius: 10px; border: 1px dashed var(--line); background: transparent;
  display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 6px; cursor: pointer; color: var(--muted);
  font: 500 clamp(10px, 2.2vw, 14px)/1.25 var(--font);
  transition: background .15s ease, border-color .15s ease, color .15s ease;
  overflow: hidden;
}
.cell:hover { border-color: var(--accent); color: var(--accent); }
.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cell .plus { font-size: 1.4em; font-weight: 400; line-height: 1; }
.cell.filled { border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.cell.filled:hover { border-color: var(--accent); }
.cell .txt { overflow-wrap: anywhere; hyphens: auto; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.cell .by {
  position: absolute; left: 6px; right: 6px; bottom: 4px;
  font: 400 clamp(8px, 1.4vw, 10px)/1.1 var(--mono); color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cell .tools { position: absolute; top: 3px; right: 3px; display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
.cell:hover .tools, .cell:focus-within .tools { opacity: 1; }
@media (hover: none) { .cell .tools { opacity: .7; } }
.tool {
  width: 20px; height: 20px; border-radius: 5px; border: 0; padding: 0; cursor: pointer;
  background: var(--bg); color: var(--muted); font: 500 12px/20px var(--font);
}
.tool:hover { background: var(--line); color: var(--ink); }
.tool:focus-visible { outline: 2px solid var(--accent); }

.cell.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cell.done:hover { border-color: var(--accent); }
.cell.done .by { color: var(--accent-ink); opacity: .75; }
.cell.done .tool { background: transparent; color: var(--accent-ink); }
.cell.done::before {
  content: ""; position: absolute; top: 7px; left: 7px; width: 9px; height: 5px;
  border-left: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg);
}
.cell.inline { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.cell.free { cursor: default; background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.cell.free::before { content: none; }
.cell.free .by { color: var(--accent); }

.cell textarea {
  position: absolute; inset: 0; width: 100%; height: 100%; resize: none; border: 2px solid var(--accent);
  border-radius: 10px; background: var(--surface); color: var(--ink); padding: 6px;
  font: 500 clamp(10px, 2.2vw, 14px)/1.25 var(--font); text-align: center;
}
.cell textarea:focus { outline: none; }

.section { display: flex; flex-direction: column; gap: 10px; }
.section h2 { margin: 0; font-size: 13px; font-weight: 500; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  border-radius: 999px; padding: 4px 11px; font: 400 13px/1.3 var(--font);
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chip.used { opacity: .4; }
.chip .uses { margin-left: 6px; color: var(--muted); font: 400 11px/1 var(--mono); font-variant-numeric: tabular-nums; }

.btns, .confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.confirm { font-size: 14px; }
.btn {
  border: 1px solid transparent; border-radius: 8px; padding: 8px 13px; cursor: pointer;
  font: 500 14px/1.1 var(--font); background: var(--accent); color: var(--accent-ink);
}
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn.danger { background: var(--danger); color: #fff; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.notice { margin: 0; font-size: 13px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { .cell { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1>Meeting-Bingo</h1>
      <span class="live" id="live"><span class="dot"></span><span id="liveText">verbinde …</span></span>
    </div>
    <p class="claim">Alle tragen Begriffe ins Raster ein. Fällt einer im Meeting, wird er abgehakt.</p>
  </header>

  <form class="who" id="whoForm" autocomplete="off">
    <div class="field">
      <label for="myName">Dein Name (optional)</label>
      <input id="myName" maxlength="30" placeholder="Kim">
    </div>
    <div class="field">
      <label for="boardName">Board</label>
      <input id="boardName" maxlength="40" placeholder="weekly">
    </div>
    <button class="btn ghost" type="submit">Öffnen</button>
    <button class="btn ghost" type="button" id="copyLink">Link kopieren</button>
  </form>

  <section class="board" aria-label="Bingo-Raster">
    <div class="status">
      <span><b id="said">0</b> gesagt · <b id="lines">0</b> von 12 Reihen</span>
      <span>Leeres Feld: eintragen · Volles Feld: abhaken</span>
    </div>
    <div class="grid" id="grid" role="grid"></div>
  </section>

  <section class="section">
    <h2>Häufig genutzt – Klick füllt das nächste freie Feld</h2>
    <div class="chips" id="chips"></div>
    <p class="notice" id="chipsEmpty">Noch leer. Hier erscheinen eure meistgenutzten Begriffe.</p>
  </section>

  <section class="section">
    <h2>Board</h2>
    <div class="btns" id="actionBtns">
      <button class="btn ghost" id="randomFill" type="button">Rest zufällig füllen</button>
      <button class="btn ghost" id="resetChecks" type="button">Häkchen zurücksetzen</button>
      <button class="btn ghost" id="clearAll" type="button">Raster leeren</button>
    </div>
    <div class="confirm" id="confirm" hidden>
      <span id="confirmText"></span>
      <button class="btn danger" id="confirmYes" type="button">Bestätigen</button>
      <button class="btn ghost" id="confirmNo" type="button">Abbrechen</button>
    </div>
    <p class="notice" id="notice" hidden></p>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
  // Öffentlicher Publishable Key: darf im Browser stehen, Zugriff regelt Row Level Security.
  window.BINGO_CONFIG = {
    url: "https://kxrnwdzxypfepnaafdfn.supabase.co",
    key: "sb_publishable_MnMq0DnmXk35gplnmPMhYA_7UJ1YE-8",
    table: "bingo_cells",
    usesTable: "bingo_term_uses",
    topView: "bingo_top_terms"
  };
</script>
<script>
(() => {
  const SIZE = 5, CENTER = 12;
  const FREE_TEXT = "Frei";
  const TOP_LIMIT = 24;
  let topTerms = []; // [{term, uses}] — meistgenutzte Begriffe dieses Boards
  const LINES = [];
  for (let r = 0; r < SIZE; r++) LINES.push([0,1,2,3,4].map(c => r * SIZE + c));
  for (let c = 0; c < SIZE; c++) LINES.push([0,1,2,3,4].map(r => r * SIZE + c));
  LINES.push([0,6,12,18,24], [4,8,12,16,20]);

  const $ = id => document.getElementById(id);
  const grid = $("grid"), chips = $("chips");
  const idOf = i => "c" + String(i).padStart(2, "0");

  // state: index -> {text, done, by}
  const state = new Map();
  const CFG = window.BINGO_CONFIG || {};
  let sb = null, channel = null;
  let editing = -1, editor = null;
  let lastLines = null;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };
  const cleanBoard = s => (s || "").toLowerCase().trim().replace(/[^a-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
  let board = cleanBoard(decodeURIComponent(location.hash.slice(1))) || "weekly";
  const myName = () => $("myName").value.trim().slice(0, 30) || null;

  // ---------- writes (Supabase or local fallback) ----------
  async function writeCell(i, data) {
    const prev = state.get(i);
    const isNewTerm = data !== null && (!prev || prev.text !== data.text);
    if (data === null) state.delete(i); else state.set(i, data);
    render();
    if (!sb) return;
    const q = sb.from(CFG.table);
    const { error } = data === null
      ? await q.delete().eq("board", board).eq("cell", i)
      : await q.upsert({ board, cell: i, text: data.text, done: data.done, added_by: data.by, updated_at: new Date().toISOString() });
    if (error) { showNotice("Speichern hat nicht geklappt (" + error.message + "). Bitte nochmal versuchen."); return; }
    if (isNewTerm) await sb.from(CFG.usesTable).insert({ board, term: data.text });
  }

  // ---------- meistgenutzte Begriffe ----------
  let topTimer;
  async function loadTopTerms() {
    if (!sb) return renderChips();
    const { data, error } = await sb.from(CFG.topView).select("term, uses")
      .eq("board", board).order("uses", { ascending: false }).order("last_used", { ascending: false }).limit(TOP_LIMIT);
    if (!error) topTerms = data;
    renderChips();
  }
  const refreshTopTerms = () => { clearTimeout(topTimer); topTimer = setTimeout(loadTopTerms, 800); };
  function renderChips() {
    chips.replaceChildren();
    $("chipsEmpty").hidden = topTerms.length > 0;
    topTerms.forEach(({ term, uses }) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.dataset.term = term;
      b.append(term);
      const n = document.createElement("span"); n.className = "uses"; n.textContent = uses + "×"; b.append(n);
      b.title = uses + "× eingetragen";
      chips.append(b);
    });
    render();
  }

  // ---------- render ----------
  function render() {
    const doneSet = new Set([CENTER]);
    let said = 0;
    state.forEach((v, i) => { if (v.text && v.done) { doneSet.add(i); said++; } });
    const done = LINES.filter(l => l.every(i => doneSet.has(i)));
    const inLine = new Set(done.flat());

    for (let i = 0; i < SIZE * SIZE; i++) {
      let el = grid.children[i];
      if (!el) { el = document.createElement("div"); el.className = "cell"; el.dataset.i = i; el.tabIndex = 0; grid.appendChild(el); }
      if (i === editing) continue;
      el.replaceChildren();
      el.className = "cell";
      if (i === CENTER) {
        el.classList.add("filled", "free", "done");
        el.tabIndex = -1;
        if (inLine.has(i)) el.classList.add("inline");
        const t = document.createElement("span"); t.className = "txt"; t.textContent = FREE_TEXT; el.append(t);
        el.setAttribute("aria-label", "Freifeld: " + FREE_TEXT);
        continue;
      }
      el.tabIndex = 0;
      const v = state.get(i);
      if (!v || !v.text) {
        const p = document.createElement("span"); p.className = "plus"; p.textContent = "+"; el.append(p);
        el.setAttribute("aria-label", "Leeres Feld, Begriff eintragen");
        continue;
      }
      el.classList.add("filled");
      if (v.done) el.classList.add("done");
      if (inLine.has(i)) el.classList.add("inline");
      const t = document.createElement("span"); t.className = "txt"; t.textContent = v.text; el.append(t);
      if (v.by) { const b = document.createElement("span"); b.className = "by"; b.textContent = "von " + v.by; el.append(b); }
      const tools = document.createElement("div"); tools.className = "tools";
      tools.append(mkTool("✎", "Bearbeiten", "edit"), mkTool("×", "Feld leeren", "clear"));
      el.append(tools);
      el.setAttribute("aria-label", v.text + (v.done ? ", gesagt" : ", noch nicht gesagt") + ". Antippen zum " + (v.done ? "Zurücknehmen" : "Abhaken"));
    }

    $("lines").textContent = done.length;
    $("said").textContent = said;
    const used = new Set([...state.values()].map(v => (v.text || "").toLowerCase()));
    [...chips.children].forEach(c => c.classList.toggle("used", used.has(c.dataset.term.toLowerCase())));

    lastLines = done.length;
  }

  function mkTool(label, title, act) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tool"; b.textContent = label; b.title = title;
    b.setAttribute("aria-label", title); b.dataset.act = act;
    return b;
  }

  // ---------- editing ----------
  function startEdit(i) {
    if (i === CENTER) return;
    if (editing !== -1) finishEdit(true);
    editing = i;
    const el = grid.children[i];
    el.replaceChildren();
    editor = document.createElement("textarea");
    editor.id = "edit-" + i;
    editor.maxLength = 60;
    editor.placeholder = "Buzzword …";
    editor.setAttribute("aria-label", "Begriff eingeben");
    editor.value = (state.get(i) || {}).text || "";
    editor.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); finishEdit(true); }
      if (e.key === "Escape") { e.preventDefault(); finishEdit(false); }
    });
    editor.addEventListener("blur", () => finishEdit(true));
    el.append(editor);
    editor.focus();
  }
  function finishEdit(save) {
    if (editing === -1) return;
    const i = editing, val = editor.value.trim().replace(/\s+/g, " ");
    editing = -1; editor = null;
    const prev = state.get(i);
    if (save && val && (!prev || prev.text !== val)) {
      writeCell(i, { text: val, done: false, by: myName() || (prev && prev.by) || null });
    } else render();
  }

  grid.addEventListener("click", e => {
    const cell = e.target.closest(".cell"); if (!cell) return;
    const i = +cell.dataset.i;
    if (i === editing || i === CENTER) return;
    const tool = e.target.closest(".tool");
    const v = state.get(i);
    if (tool) {
      e.stopPropagation();
      if (tool.dataset.act === "edit") startEdit(i);
      else writeCell(i, null);
      return;
    }
    if (!v || !v.text) startEdit(i);
    else writeCell(i, { ...v, done: !v.done });
  });
  grid.addEventListener("keydown", e => {
    if (e.target.tagName === "TEXTAREA" || e.target.tagName === "BUTTON") return;
    const cell = e.target.closest(".cell"); if (!cell) return;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); cell.click(); }
  });

  // ---------- quick picks ----------
  function emptyCells() { const out = []; for (let i = 0; i < 25; i++) if (i !== CENTER && !(state.get(i) || {}).text) out.push(i); return out; }
  chips.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b || b.classList.contains("used")) return;
    const free = emptyCells();
    if (!free.length) { showNotice("Das Raster ist voll. Leere zuerst ein Feld (×)."); return; }
    writeCell(free[0], { text: b.dataset.term, done: false, by: myName() });
  });
  $("randomFill").addEventListener("click", async () => {
    const free = emptyCells();
    const used = new Set([...state.values()].map(v => (v.text || "").toLowerCase()));
    const pool = topTerms.map(t => t.term).filter(w => !used.has(w.toLowerCase())).sort(() => Math.random() - .5);
    if (!pool.length) { showNotice("Noch keine freien Vorschläge. Die Liste wächst mit euren Einträgen."); return; }
    for (const i of free) { const w = pool.pop(); if (!w) break; await writeCell(i, { text: w, done: false, by: myName() }); }
  });

  // ---------- reset with in-page confirm ----------
  let pending = null;
  function ask(text, fn) { pending = fn; $("confirmText").textContent = text; $("confirm").hidden = false; $("actionBtns").hidden = true; $("confirmYes").focus(); }
  function closeAsk() { pending = null; $("confirm").hidden = true; $("actionBtns").hidden = false; }
  $("confirmNo").addEventListener("click", closeAsk);
  $("confirmYes").addEventListener("click", async () => { const fn = pending; closeAsk(); if (fn) await fn(); });
  $("resetChecks").addEventListener("click", () => ask("Alle Häkchen entfernen? Die Begriffe bleiben.", async () => {
    state.forEach(v => { v.done = false; });
    lastLines = null; render();
    if (sb) { const { error } = await sb.from(CFG.table).update({ done: false }).eq("board", board).eq("done", true); if (error) showNotice("Zurücksetzen hat nicht geklappt: " + error.message); }
  }));
  $("clearAll").addEventListener("click", () => ask("Wirklich alle Begriffe für alle löschen?", async () => {
    state.clear(); lastLines = null; render();
    if (sb) { const { error } = await sb.from(CFG.table).delete().eq("board", board); if (error) showNotice("Leeren hat nicht geklappt: " + error.message); }
  }));

  // ---------- celebration ----------

  function showNotice(msg) { const n = $("notice"); n.textContent = msg; n.hidden = false; }
  function setLive(on, text) { $("live").classList.toggle("on", on); $("liveText").textContent = text; }

  // ---------- board & name ----------
  $("myName").value = store.get("bingo-name") || "";
  $("myName").addEventListener("change", () => store.set("bingo-name", $("myName").value.trim()));
  $("whoForm").addEventListener("submit", e => {
    e.preventDefault();
    const b = cleanBoard($("boardName").value) || "weekly";
    if (b !== board) location.hash = b; else connect();
  });
  window.addEventListener("hashchange", () => { board = cleanBoard(decodeURIComponent(location.hash.slice(1))) || "weekly"; connect(); });
  $("copyLink").addEventListener("click", async () => {
    const url = location.href.split("#")[0] + "#" + board;
    try { await navigator.clipboard.writeText(url); $("copyLink").textContent = "Kopiert!"; }
    catch { showNotice("Link zum Teilen: " + url); }
    setTimeout(() => { $("copyLink").textContent = "Link kopieren"; }, 1800);
  });

  // ---------- boot ----------
  function applyRow(r) {
    if (!r || r.board !== board) return;
    const i = r.cell;
    if (!Number.isInteger(i) || i < 0 || i > 24 || i === CENTER) return;
    state.set(i, { text: String(r.text).slice(0, 60), done: !!r.done, by: r.added_by || null });
  }
  async function connect() {
    $("boardName").value = board;
    document.title = "Meeting-Bingo · " + board;
    state.clear(); topTerms = []; lastLines = null; render();
    loadTopTerms();
    if (!sb) return;
    if (channel) { await sb.removeChannel(channel); channel = null; }
    setLive(false, "verbinde …");
    const { data, error } = await sb.from(CFG.table).select("*").eq("board", board);
    if (error) { setLive(false, "offline"); showNotice("Board konnte nicht geladen werden: " + error.message); return; }
    state.clear(); data.forEach(applyRow); lastLines = null; render();
    channel = sb.channel("bingo-" + board)
      .on("postgres_changes", { event: "*", schema: "public", table: CFG.table, filter: "board=eq." + board }, payload => {
        if (payload.eventType === "DELETE") { const o = payload.old || {}; if (o.board === board) state.delete(o.cell); }
        else applyRow(payload.new);
        render();
        if (payload.eventType !== "DELETE") refreshTopTerms();
      })
      .subscribe(status => {
        if (status === "SUBSCRIBED") setLive(true, "live · Board „" + board + "“");
        else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") setLive(false, "Live-Verbindung weg");
      });
  }

  render();
  if (window.supabase && CFG.url && CFG.key) {
    sb = window.supabase.createClient(CFG.url, CFG.key);
  } else {
    setLive(false, "nur lokal");
    showNotice("Keine Verbindung zur Datenbank. Du kannst lokal spielen; andere sehen deine Einträge nicht.");
  }
  connect();
})();
</script>
</body>
</html>
